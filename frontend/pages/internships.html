<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Opportunities - Placement Circle</title>

    <link rel="stylesheet" href="../css/internships.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>

<body>

    <div class="page">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo-area">
                <div class="logo-icon"></div>

                <div class="logo-text">
                    Placement <span>Circle</span>
                </div>
            </div>


            <nav class="sidebar-nav">

                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>
                </a>

                <a href="daily-prep.html" class="nav-item">
                    <span class="nav-icon">ϟ</span>
                    <span>Daily Prep</span>
                </a>

                <a href="practice.html" class="nav-item">
                    <span class="nav-icon">▣</span>
                    <span>Practice</span>
                </a>

                <a href="internships.html" class="nav-item active">
                    <span class="nav-icon">▤</span>
                    <span>Internships</span>
                </a>

                <a href="alumni.html" class="nav-item">
                    <span class="nav-icon">♧</span>
                    <span>Alumni</span>
                </a>

                <a href="leaderboard.html" class="nav-item">
                    <span class="nav-icon">♜</span>
                    <span>Leaderboard</span>
                </a>

                <a href="progress.html" class="nav-item">
                    <span class="nav-icon">⌁</span>
                    <span>Progress</span>
                </a>

                <a href="profile.html" class="nav-item">
                    <span class="nav-icon">♙</span>
                    <span>Profile</span>
                </a>

            </nav>


            <div class="sidebar-bottom">

                <button class="bottom-item" id="themeBtn">
                    <span>☼</span>
                    <span>Light mode</span>
                </button>

                <button class="bottom-item" id="logoutBtn">
                    <span>↪</span>
                    <span>Log out</span>
                </button>

            </div>

        </aside>


        <!-- MAIN -->
        <main class="main">

            <!-- TOPBAR -->
            <header class="topbar">

                <div class="topbar-right">

                    <button class="notification">♧</button>

                    <div class="profile">

                        <div class="avatar">AA</div>

                        <div class="profile-info">
                            <strong>Aarav Patel</strong>
                            <span>CSE · Final Year</span>
                        </div>

                    </div>

                </div>

            </header>


            <!-- CONTENT -->
            <section class="content">

                <!-- TITLE + TYPE FILTER -->
                <div class="page-top">

                    <div class="page-header">
                        <h1>Opportunities</h1>
                        <p>Curated internships and jobs for you.</p>
                    </div>

                    <div class="type-filters" id="typeFilters">
                        <button class="type-btn active" data-type="all">All</button>
                        <button class="type-btn" data-type="internship">Internships</button>
                        <button class="type-btn" data-type="job">Jobs</button>
                    </div>

                </div>


                <!-- SEARCH -->
                <div class="search-wrapper">

                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>

                    <input type="text" id="searchInput" class="search-input"
                        placeholder="Search company or role..." autocomplete="off">

                </div>


                <!-- CARDS (rendered by js/internships.js) -->
                <div class="cards-grid" id="cardsGrid"></div>

                <div id="emptyState" class="empty-state">
                    No opportunities found. Try a different search.
                </div>

            </section>

        </main>

    </div>


    <button id="scrollTop" class="scroll-top">↑</button>

    <script src="../js/internships.js"></script>

<script src="../js/animations.js"></script>

</body>

</html>
