<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question - Placement Circle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/daily-prep.css">
    <link rel="stylesheet" href="../css/question.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-logo">P</div>
            <span>Placement Circle</span>
        </div>

        <nav class="navigation">

            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">⌂</span>
                <span>Dashboard</span>
            </a>

            <a href="daily-prep.html" class="nav-item">
                <span class="nav-icon">ϟ</span>
                <span>Daily Prep</span>
            </a>

            <a href="practice.html" class="nav-item active">
                <span class="nav-icon">▣</span>
                <span>Practice</span>
            </a>

            <a href="internships.html" class="nav-item">
                <span class="nav-icon">▥</span>
                <span>Internships</span>
            </a>

            <a href="alumni.html" class="nav-item">
                <span class="nav-icon">♙</span>
                <span>Alumni</span>
            </a>

            <a href="leaderboard.html" class="nav-item">
                <span class="nav-icon">♕</span>
                <span>Leaderboard</span>
            </a>

            <a href="progress.html" class="nav-item">
                <span class="nav-icon">⌁</span>
                <span>Progress</span>
            </a>

            <a href="profile.html" class="nav-item">
                <span class="nav-icon">♙</span>
                <span>Profile</span>
            </a>

        </nav>


        <div class="sidebar-bottom">

            <button class="bottom-item" id="themeBtn">
                <span>☼</span>
                <span>Light mode</span>
            </button>

            <button class="bottom-item" id="logoutBtn">
                <span>↪</span>
                <span>Log out</span>
            </button>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <!-- TOP BAR -->

        <header class="topbar">

            <div class="topbar-space"></div>

            <div class="top-right">

                <button class="notification-btn" title="Notifications">
                    ♧
                </button>

                <div class="profile-mini">

                    <div class="avatar">
                        &nbsp;
                    </div>

                    <div class="profile-info">
                        <strong>&nbsp;</strong>
                        <span>&nbsp;</span>
                    </div>

                </div>

            </div>

        </header>


        <!-- CONTENT -->

        <section class="content">

            <a class="back-link" id="backLink" href="practice.html">‹ Back to Practice</a>

            <div class="q-panel" id="qPanel">

                <div class="q-loading" id="qLoading">Loading question...</div>

                <div id="qContent" hidden>

                    <div class="q-head">
                        <span class="q-cat" id="qCat"></span>
                        <span id="qDiff"></span>
                        <span class="q-time" id="qTime"></span>
                        <span class="q-solved" id="qSolved" hidden>✓ Solved</span>
                    </div>

                    <h1 id="qTitle"></h1>
                    <p class="q-companies" id="qCompanies"></p>

                    <div class="q-body" id="qBody"></div>

                    <div id="qOptions" class="q-options"></div>

                    <div class="q-actions" id="qActions"></div>

                    <details class="q-hint">
                        <summary>Need a hint?</summary>
                        <p id="qHint"></p>
                    </details>

                    <div class="q-result" id="qResult" hidden></div>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="../js/api.js"></script>
<script src="../js/question.js"></script>
<script src="../js/animations.js"></script>
</body>
</html>
