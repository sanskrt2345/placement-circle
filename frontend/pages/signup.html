<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Placement Circle</title>

    <!-- Signup CSS -->
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>

<body>

    <div class="signup-page">

        <!-- ================= LOGO ================= -->

        <div class="logo">

            <span class="logo-circle"></span>

            <span>
                Placement <strong>Circle</strong>
            </span>

        </div>


        <!-- ================= LEFT SIDE ================= -->

        <section class="signup-left">

            <div class="left-content">

                <h1>
                    Your <span>circle</span> is one signup away.
                </h1>

                <p>
                    Join thousands of students building the placement habit.
                </p>

            </div>


            <div class="bottom-text">
                Practice. Track. Connect. Get placed.
            </div>

        </section>


        <!-- ================= RIGHT SIDE ================= -->

        <section class="signup-right">

            <div class="signup-form">

                <h2>
                    Create your account
                </h2>

                <p class="subtitle">
                    Use your college email — we'll send a 6-digit code.
                </p>


                <!-- FULL NAME -->

                <label for="fullName">
                    Full name
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    autocomplete="name"
                    required
                >


                <!-- COLLEGE EMAIL -->

                <label for="email">
                    College email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    required
                >


                <!-- CONFIRM PASSWORD -->

                <label for="confirmPassword">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    autocomplete="new-password"
                    required
                >


                <!-- BRANCH + YEAR (used for the branch / year leaderboards) -->
                <div class="field-row">
                    <div>
                        <label for="branch">
                            Branch
                        </label>
                        <select id="branch" name="branch">
                            <option value="">Select</option>
                            <option>CSE</option>
                            <option>IT</option>
                            <option>ECE</option>
                            <option>EEE</option>
                            <option>Mechanical</option>
                            <option>Civil</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div>
                        <label for="year">
                            Year
                        </label>
                        <select id="year" name="year">
                            <option value="">Select</option>
                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>Final Year</option>
                        </select>
                    </div>
                </div>

                <p class="form-error" id="formError" role="alert" hidden></p>
                <p class="form-info" id="formInfo" hidden></p>

                <!-- SEND OTP -->
                <button
                    type="button"
                    class="otp-btn"
                    id="sendOtpBtn"
                    onclick="sendOTP()"
                >
                    Send OTP
                </button>

                <!-- OTP STEP (shown after the code is emailed) -->
                <div class="otp-step" id="otpStep" hidden>
                    <label for="otp">
                        6-digit code
                    </label>
                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        maxlength="6"
                        placeholder="______"
                    >
                    <button
                        type="button"
                        class="otp-btn"
                        id="verifyBtn"
                        onclick="verifyOTP()"
                    >
                        Verify &amp; create account
                    </button>
                    <button
                        type="button"
                        class="link-btn"
                        id="resendBtn"
                        onclick="resendOTP()"
                    >
                        Resend code
                    </button>
                </div>


                <!-- LOGIN -->

                <p class="login-text">

                    Already have an account?

                    <a href="login.html">
                        Log in
                    </a>

                </p>

            </div>

        </section>

    </div>


    <!-- Signup JavaScript -->
    <script src="../js/api.js"></script>
    <script src="../js/signup.js"></script>

<script src="../js/animations.js"></script>

</body>

</html>
