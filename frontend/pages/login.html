<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Placement Circle</title>

    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>

<body>

    <div class="login-page">

        <!-- ================= LOGO ================= -->

        <div class="logo">
            <span class="logo-circle"></span>

            <span>
                Placement <strong>Circle</strong>
            </span>
        </div>


        <!-- ================= LEFT SECTION ================= -->

        <section class="login-left">

            <div class="left-content">

                <h1>
                    Prepare smarter.
                    <span>Every single day.</span>
                </h1>

                <p>
                    Login and pick up your streak where you left off.
                    Your dream company is 3 questions away.
                </p>

            </div>


            <div class="bottom-text">
                Your placement prep, in one circle.
            </div>

        </section>


        <!-- ================= RIGHT SECTION ================= -->

        <section class="login-right">

            <div class="login-form-container">

                <h2>Welcome back</h2>

                <p class="subtitle">
                    Continue your placement journey.
                </p>


                <!-- ================= LOGIN FORM ================= -->

                <form id="loginForm">

                    <!-- COLLEGE EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            College email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your college email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-btn"
                    >
                        Log in
                    </button>

                </form>


                <!-- ================= SIGNUP LINK ================= -->

                <p class="signup-text">

                    New here?

                    <a href="signup.html">
                        Create an account
                    </a>

                </p>


                <div class="divider"></div>

            </div>

        </section>

    </div>


    <!-- LOGIN JS -->

    <script src="../js/login.js"></script>

<script src="../js/animations.js"></script>

</body>

</html>
