<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practice Library - Placement Circle</title>

    <link rel="stylesheet" href="../css/practice.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>

<body>

    <div class="page">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo-area">
                <div class="logo-icon"></div>

                <div class="logo-text">
                    Placement <span>Circle</span>
                </div>
            </div>


            <nav class="sidebar-nav">

                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>
                </a>

                <a href="daily-prep.html" class="nav-item">
                    <span class="nav-icon">ϟ</span>
                    <span>Daily Prep</span>
                </a>

               <a href="practice.html" class="nav-item active">
                <span class="nav-icon">▣</span>
                <span>Practice</span>
                </a>

                <a href="internships.html" class="nav-item">
                    <span class="nav-icon">▤</span>
                    <span>Internships</span>
                </a>

                <a href="alumni.html" class="nav-item">
                    <span class="nav-icon">♧</span>
                    <span>Alumni</span>
                </a>

                <a href="leaderboard.html" class="nav-item">
                    <span class="nav-icon">♜</span>
                    <span>Leaderboard</span>
                </a>

                <a href="progress.html" class="nav-item">
                    <span class="nav-icon">⌁</span>
                    <span>Progress</span>
                </a>

                <a href="profile.html" class="nav-item">
                    <span class="nav-icon">♙</span>
                    <span>Profile</span>
                </a>

            </nav>


            <div class="sidebar-bottom">

                <button class="bottom-item" id="themeBtn">
                    <span>☼</span>
                    <span>Light mode</span>
                </button>

                <button class="bottom-item" id="logoutBtn">
                    <span>↪</span>
                    <span>Log out</span>
                </button>

            </div>

        </aside>


        <!-- MAIN -->
        <main class="main">

            <!-- TOPBAR -->
            <header class="topbar">

                <div class="topbar-right">

                    <button class="notification">
                        ♧
                    </button>

                    <div class="profile">

                        <div class="avatar">
                            &nbsp;
                        </div>

                        <div class="profile-info">

                            <strong>
                                &nbsp;
                            </strong>

                            <span>
                                &nbsp;
                            </span>

                        </div>

                    </div>

                </div>

            </header>


            <!-- CONTENT -->
            <section class="content">

                <!-- HEADER -->
                <div class="page-header">

                    <h1>
                        Practice Library
                    </h1>

                    <p>
                        Search questions, topics, and companies.
                    </p>

                </div>


                <!-- FILTER PANEL -->
                <div class="filter-panel">

                    <!-- SEARCH -->
                    <div class="search-wrapper">

                        <span class="search-icon">
                            ⌕
                        </span>

                        <input
                            type="text"
                            id="searchInput"
                            class="search-input"
                            placeholder="Search questions, topics..."
                            autocomplete="off">

                    </div>


                    <!-- FILTERS -->
                    <div class="filter-row">

                        <!-- CATEGORY -->
                        <div class="filter-group" id="categoryFilters">

                            <button
                                class="filter-btn active"
                                data-category="all">
                                All
                            </button>

                            <button
                                class="filter-btn"
                                data-category="DSA">
                                DSA
                            </button>

                            <button
                                class="filter-btn"
                                data-category="Aptitude">
                                Aptitude
                            </button>

                            <button
                                class="filter-btn"
                                data-category="HR">
                                HR
                            </button>

                        </div>


                        <div class="filter-divider"></div>


                        <!-- DIFFICULTY -->
                        <div class="filter-group" id="difficultyFilters">

                            <button
                                class="filter-btn active"
                                data-difficulty="all">
                                All
                            </button>

                            <button
                                class="filter-btn"
                                data-difficulty="Easy">
                                Easy
                            </button>

                            <button
                                class="filter-btn"
                                data-difficulty="Medium">
                                Medium
                            </button>

                            <button
                                class="filter-btn"
                                data-difficulty="Hard">
                                Hard
                            </button>

                        </div>

                    </div>

                </div>


                <!-- PRACTICE LIST -->
                <div class="practice-card">

                    <!-- HEADER -->
                    <div class="table-header">

                        <div>Title</div>

                        <div>Category</div>

                        <div>Difficulty</div>

                        <div>Time</div>

                    </div>


                    <!-- QUESTIONS -->
                    <div id="questionList">
</div>


                    <div id="emptyState" class="empty-state">
                        No questions found.
                    </div>

                </div>

            </section>

        </main>

    </div>


    <button
        id="scrollTop"
        class="scroll-top">
        ↑
    </button>


<script src="../js/api.js"></script>
<script src="../js/practice.js"></script>

<script src="../js/animations.js"></script>

</body>
</html>
